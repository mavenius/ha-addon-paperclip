name: Paperclip AI
version: "1.0.1"
slug: paperclip_ai
description: Runs the Paperclip AI multi-agent orchestration server (paperclipai on npm) as a Home Assistant add-on
url: https://github.com/paperclipai/paperclip
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ports:
  3100/tcp: 3100
ports_description:
  3100/tcp: Paperclip web UI
options:
  anthropic_api_key: ""
  openai_api_key: ""
  better_auth_secret: "changeme-generate-a-random-string"
  public_url: ""
schema:
  anthropic_api_key: str?
  openai_api_key: str?
  better_auth_secret: str
  public_url: str?
